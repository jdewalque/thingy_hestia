# --- Système -----------------------------------------------------------------
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
# La partie sécurisée (TF-M) se tait et libère UART1, utilisé pour nos journaux.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_TFM_SECURE_UART=n
CONFIG_FPU=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# --- Liaison avec l'application (UART0 <-> Bluetooth via le nRF5340) ---------
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CJSON_LIB=y

# --- Réglages conservés en mémoire flash -------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Modem, LTE et SMS -------------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
CONFIG_LTE_PSM_REQ_RAT="00000100"
CONFIG_AT_MONITOR_HEAP_SIZE=4096
CONFIG_SMS=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_DATE_TIME=y
CONFIG_MODEM_JWT=y

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# --- nRF Cloud (conversion Wi-Fi / antennes -> coordonnées, aide au GPS) ------
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=2048
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0

# --- Localisation ------------------------------------------------------------
CONFIG_LOCATION=y
CONFIG_LOCATION_METHOD_GNSS=y
CONFIG_LOCATION_METHOD_CELLULAR=y
CONFIG_LOCATION_METHOD_WIFI=y
CONFIG_LOCATION_SERVICE_NRF_CLOUD=y
CONFIG_LOCATION_METHOD_WIFI_SCANNING_RESULTS_MAX_CNT=20
